services:
  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - media:/app/media
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  media:
  pgdata:
